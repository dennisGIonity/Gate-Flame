name: CI

# Runs on every push and PR. This is the check that would have caught, before
# they reached main: the stale committed bundles, the corrupt release tarball,
# the dependency advisories, and build output being tracked at all.

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'build/**', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and check repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Frontend tests
        # 109 vitest cases that CI has never run. NODE_ENV is pinned because a
        # machine-level NODE_ENV=production makes react-dom load its production
        # bundle, where React.act is stripped, and 23 of these fail for a reason
        # that has nothing to do with the code under test.
        env:
          NODE_ENV: test
        run: npm run test:run

      - name: Build (web)
        run: npm run build

      - name: Build (mobile + kiosk HTML)
        run: |
          npm run build:html-mobile
          npm run build:html-kiosk

      - name: Assert Capacitor webDir has an index.html
        # dist-mobile/index.html was previously committed by hand and produced
        # by no script. Without it, `cap sync` gives the APK a webDir with
        # nothing to load and the app opens to a blank screen.
        run: |
          test -f dist-mobile/index.html || { echo "::error::dist-mobile/index.html missing — cap sync would produce a blank app"; exit 1; }
          test -f dist-kiosk/index.html  || { echo "::error::dist-kiosk/index.html missing"; exit 1; }
          echo "✓ both webDirs have an index.html"

      - name: Package and verify release tarball
        # `npm run package:release` ends in `gzip -t`. The tarball on main was
        # once a UTF-8-mangled file with 282,516 replacement characters in it;
        # this step makes that unshippable rather than undetected.
        run: npm run package:release

      - name: Assert tarball is real gzip
        run: |
          f=release/GateFlame-Complete-Package.tar.gz
          gzip -t "$f" || { echo "::error::$f is not valid gzip"; exit 1; }
          magic=$(od -An -tx1 -N2 "$f" | tr -d ' ')
          [ "$magic" = "1f8b" ] || { echo "::error::bad magic bytes: $magic (expected 1f8b)"; exit 1; }
          if grep -qc $'\xef\xbf\xbd' "$f" 2>/dev/null; then
            echo "::error::$f contains U+FFFD — it has been through a text decode"; exit 1
          fi
          echo "✓ tarball magic 1f8b, gzip verifies, no replacement characters"

      - name: Assert no build output or secrets are tracked
        run: |
          fail=0
          if git ls-files | grep -E '^(dist|dist-kiosk|dist-mobile|dist-standalone|release|node_modules)/' ; then
            echo "::error::build output is tracked in git — see CONTRIBUTING.md rule 2"; fail=1
          fi
          if git ls-files | grep -E '\.(apk|aab|jks|keystore|tar\.gz)$' ; then
            echo "::error::binary artefact tracked in git"; fail=1
          fi
          if git ls-files | grep -E '(^|/)keystore\.properties$|(^|/)\.env$' ; then
            echo "::error::a secret file is tracked in git"; fail=1
          fi
          if git ls-files | grep -E '^capacitor\..*\.json$' ; then
            echo "::error::a capacitor .json config is back — it silently shadows capacitor.config.ts"; fail=1
          fi
          [ "$fail" = "0" ] && echo "✓ nothing tracked that should not be"
          exit $fail

      - name: Assert the applicationId agrees in all five places
        # Decided 2026-08-14 and now FROZEN: today.ionity.gateflame (reverse-DNS
        # of ionity.today, a domain Ionity provably controls). The retired value
        # was org.ionity.gateflame, and ionity.org is not ours.
        #
        # An applicationId can never change after the first unit ships — a
        # different id is a different app, so every fielded customer would have
        # to uninstall, reinstall and re-pair, and re-pairing wipes node state.
        # Five places must agree, and Capacitor silently tolerates a mismatch,
        # which is exactly why this is asserted rather than trusted.
        run: |
          expected="today.ionity.gateflame"
          fail=0
          check() {
            if [ "$2" != "$expected" ]; then
              echo "::error::$1 is '$2', expected '$expected'"; fail=1
            else
              echo "  ✓ $1"
            fi
          }
          check "capacitor.config.ts appId" \
            "$(grep -oP "appId:\s*'\K[^']+" capacitor.config.ts)"
          check "build.gradle applicationId" \
            "$(grep -oP 'applicationId\s+"\K[^"]+' android/app/build.gradle)"
          check "build.gradle namespace" \
            "$(grep -oP 'namespace\s*=\s*"\K[^"]+' android/app/build.gradle)"
          check "strings.xml package_name" \
            "$(grep -oP '<string name="package_name">\K[^<]+' android/app/src/main/res/values/strings.xml)"
          check "strings.xml custom_url_scheme" \
            "$(grep -oP '<string name="custom_url_scheme">\K[^<]+' android/app/src/main/res/values/strings.xml)"

          pkgdir="android/app/src/main/java/$(echo "$expected" | tr '.' '/')"
          if [ ! -f "$pkgdir/MainActivity.java" ]; then
            echo "::error::expected $pkgdir/MainActivity.java"; fail=1
          else
            echo "  ✓ Java package directory"
          fi
          if grep -rqn 'package org\.ionity\.gateflame' android/app/src 2>/dev/null; then
            echo "::error::the retired org.ionity.gateflame package declaration is still present"; fail=1
          fi
          if [ -d android/app/src/main/java/org/ionity ]; then
            echo "::error::android/app/src/main/java/org/ionity still exists — Gradle would compile both"; fail=1
          fi

          [ "$fail" = "0" ] && echo "✓ applicationId is $expected in all five places"
          exit $fail

      - name: Assert versionCode was bumped against main
        # Android refuses an APK whose versionCode is <= the installed one.
        # A PR that changes app code without bumping is a build customers
        # cannot install.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          base=$(git show origin/${{ github.base_ref }}:android/version.properties 2>/dev/null | grep '^VERSION_CODE=' | cut -d= -f2 || echo 0)
          head=$(grep '^VERSION_CODE=' android/version.properties | cut -d= -f2)
          echo "base=$base head=$head"
          if [ "$head" -le "$base" ]; then
            echo "::warning::versionCode not bumped ($head <= $base). Run 'npm run version:bump' if this PR changes app code."
          else
            echo "✓ versionCode bumped $base → $head"
          fi

  backend:
    name: Node-agent tests and lint
    runs-on: ubuntu-latest
    # 439 pytest cases covering pairing, filtering, WAN, posture and the threat
    # log. Until now the entire Python agent - the part that actually filters a
    # customer's network - was outside CI, while the React app had four gates.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        working-directory: node-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (reported, not yet enforced)
        # 51 violations exist on the tree today, most of them the deprecated
        # datetime.utcfromtimestamp() in wan.py. Making this blocking now would
        # turn CI red on arrival and teach everyone to ignore it, so it reports
        # a number instead. Turn `continue-on-error` off once the count is zero -
        # that is the commit that makes this a real gate.
        continue-on-error: true
        working-directory: node-agent
        run: ruff check gateflame

      - name: Pytest
        working-directory: node-agent
        # GATEFLAME_DB_PATH must be set, and the reason is a real defect rather
        # than a CI quirk: `main.py:41` does `store = Store(config.db_path)` at
        # MODULE SCOPE, so merely importing gateflame.main opens SQLite at the
        # default /var/lib/gateflame/state.db. Root can create that directory,
        # an unprivileged CI user cannot, and collection dies with
        # "attempt to write a readonly database" before a single test runs.
        #
        # That is why the suite passed for every developer and failed here: it
        # was only ever run as root or on a box where /var/lib/gateflame already
        # existed. tests/test_wan.py already pins this exact hazard for
        # services.py ("must not create /var/lib/gateflame ... as an import side
        # effect"); main.py never got the same treatment.
        #
        # The env var makes CI honest today. The real fix is to build the store
        # in a lifespan handler instead of at import - which would also retire
        # the deprecated @app.on_event handlers on lines 44 and 49 - and is left
        # as its own change because it touches application startup.
        env:
          GATEFLAME_DB_PATH: ${{ runner.temp }}/gateflame-test-state.db
        run: python -m pytest tests/ -q

      - name: Boot the agent and answer /system/status
        # Catches what unit tests cannot: an import error, a missing dependency,
        # or a route that no longer resolves. The agent starting is the minimum
        # claim the product makes.
        working-directory: node-agent
        env:
          GATEFLAME_DB_PATH: ${{ runner.temp }}/gateflame-boot-state.db
        run: |
          python -m uvicorn gateflame.main:app --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 20); do
            sleep 1
            if curl -fsS http://127.0.0.1:8080/api/v1/system/status > /tmp/status.json; then
              cat /tmp/status.json; echo; echo "✓ agent booted and answered"; exit 0
            fi
          done
          echo "::error::agent did not answer /api/v1/system/status within 20s"; exit 1

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
