name: Desktop release (Windows / macOS / Linux)

# Builds the Gate^Flame desktop console on a REAL runner per OS. A macOS app
# cannot honestly be produced from Windows or Linux (no code path, no signing,
# no dmg tooling), so the matrix is the only way to hand Dennis all three.
#
# Trigger: push a tag like `desktop-v1.0.2`, or run manually. Artifacts are
# attached to the workflow run (and to a GitHub Release when tagged). There is
# no publish to any store and no auto-update channel — deliberately, see
# desktop/main.cjs.
#
# Signing: unsigned on every platform for now. Windows will show SmartScreen
# on first run; macOS needs right-click → Open (or `xattr -d
# com.apple.quarantine`). Signing certificates are a purchase decision for
# Dennis, tracked in docs/gateflame-STATE-resume-here.md.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (portable exe + installer)
            script: dist:win
          - os: macos-latest
            label: macOS (dmg + zip, universal)
            script: dist:mac
          - os: ubuntu-latest
            label: Linux (AppImage + deb)
            script: dist:linux
    env:
      # A machine-level NODE_ENV=production makes `npm ci` omit devDependencies
      # (electron, electron-builder, vite). Pin it so the build tools exist.
      NODE_ENV: development
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (web)
        run: npm ci --include=dev

      - name: Typecheck + tests
        run: |
          npm run lint
          npm run test:run
        env:
          NODE_ENV: test

      - name: Build the web bundle the desktop app wraps
        run: npm run build:html-mobile

      - name: Assert the bundle exists (never package an empty shell)
        shell: bash
        run: test -f dist-mobile/index.html && ls -la dist-mobile/assets | head -20

      - name: Install (desktop)
        working-directory: desktop
        run: npm ci --include=dev || npm install --include=dev

      - name: Package
        working-directory: desktop
        run: npm run ${{ matrix.script }}

      - name: List what was produced
        shell: bash
        run: ls -la release/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gateflame-desktop-${{ runner.os }}
          path: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.AppImage
            release/desktop/*.deb
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.AppImage
            release/desktop/*.deb
          generate_release_notes: true
