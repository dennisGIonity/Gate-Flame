apply plugin: 'com.android.application'

// ── Version: single source of truth is android/version.properties ──────────
// Never hardcode versionCode/versionName here again. See that file for why.
def versionPropsFile = rootProject.file('version.properties')
if (!versionPropsFile.exists()) {
    throw new GradleException(
        "android/version.properties is missing. It is the single source of truth " +
        "for versionCode/versionName. Restore it before building — an APK with an " +
        "unknown version must never reach a customer device.")
}
def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }
def appVersionCode = versionProps['VERSION_CODE'].toString().toInteger()
def appVersionName = versionProps['VERSION_NAME'].toString()

// ── Signing ────────────────────────────────────────────────────────────────
// Local builds read android/keystore.properties (gitignored, never committed).
// CI reads environment variables instead, so no secret is written to a runner
// disk. If neither is present the release signingConfig is left unset and
// Gradle emits an UNSIGNED release APK — loud and obvious, rather than
// silently falling back to the debug key and shipping an app that can never
// be updated.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystoreFile = keystorePropsFile.exists()
if (hasKeystoreFile) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def envKeystorePath = System.getenv('GATEFLAME_KEYSTORE_PATH')
def hasEnvKeystore = envKeystorePath != null && !envKeystorePath.isEmpty()
def canSignRelease = hasKeystoreFile || hasEnvKeystore

android {
    namespace = "org.ionity.gateflame"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        if (canSignRelease) {
            release {
                if (hasEnvKeystore) {
                    storeFile file(envKeystorePath)
                    storePassword System.getenv('GATEFLAME_KEYSTORE_PASSWORD')
                    keyAlias System.getenv('GATEFLAME_KEY_ALIAS')
                    keyPassword System.getenv('GATEFLAME_KEY_PASSWORD')
                } else {
                    storeFile rootProject.file(keystoreProps['storeFile'].toString())
                    storePassword keystoreProps['storePassword'].toString()
                    keyAlias keystoreProps['keyAlias'].toString()
                    keyPassword keystoreProps['keyPassword'].toString()
                }
                // v1 must stay on for minSdk 24; v2/v3 give faster verification
                // and rotation headroom.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    defaultConfig {
        applicationId "org.ionity.gateflame"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Distinct id so a debug build can sit alongside a released one on
            // a test phone without the release install being replaced.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    // Fail the build rather than emit an unsigned release APK by accident.
    // `-PallowUnsignedRelease=true` is the deliberate escape hatch.
    afterEvaluate {
        tasks.matching { it.name.startsWith('assembleRelease') || it.name.startsWith('bundleRelease') }.configureEach { t ->
            t.doFirst {
                if (!canSignRelease && !project.hasProperty('allowUnsignedRelease')) {
                    throw new GradleException(
                        "Refusing to build an UNSIGNED release.\n" +
                        "  Create android/keystore.properties (see android/KEYSTORE.md),\n" +
                        "  or set GATEFLAME_KEYSTORE_PATH / _PASSWORD / GATEFLAME_KEY_ALIAS / _PASSWORD,\n" +
                        "  or pass -PallowUnsignedRelease=true if you genuinely want an unsigned artifact.\n" +
                        "An APK signed with the wrong key can never update one already installed\n" +
                        "in the field — every customer would have to uninstall and re-pair.")
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
