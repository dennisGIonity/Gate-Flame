# Gate^Flame Android — SINGLE SOURCE OF TRUTH for app version.
#
# Read by android/app/build.gradle. Do not set versionCode/versionName
# anywhere else.
#
# ── Why this file exists ──────────────────────────────────────────────
# versionCode was hardcoded to 1 and never bumped. Android refuses to install
# an APK whose versionCode is <= the one already installed, so every unit in
# the field would have been frozen on the first build ever shipped: the only
# way to take an update would be uninstall + reinstall, which wipes the node
# pairing. Bump VERSION_CODE on EVERY build that leaves this machine.
#
#   npm run version:bump          # +1 code, keeps name
#   npm run version:release       # +1 code, prompts for a new name
#
# VERSION_CODE  monotonic integer, never reused, never decreased.
# VERSION_NAME  human-facing semver shown in app settings and on the store.

VERSION_CODE=6
VERSION_NAME=1.0.1
