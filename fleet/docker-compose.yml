# Gate^Flame Fleet on a real server: the dashboard + Caddy (automatic HTTPS).
#
#   cp fleet.env.example fleet.env   # fill it in
#   mkdir -p data && sudo chown 10001:10001 data
#   cp /path/from/old/server/fleet.db data/      # optional: bring the fleet with you
#   docker compose up -d --build
#
# The fleet container publishes NO port: only Caddy can reach it, which is why
# it may trust Caddy's X-Forwarded-* headers. The trust range is the compose
# network's subnet, PINNED below: left to Docker, a busy host hands out
# 192.168.x.x/20 networks too, Caddy would fall outside a 172.16/12 + 10/8 trust
# range, and the app would then silently drop X-Forwarded-Proto (no Secure
# cookie, no HSTS) and key the login rate limit on Caddy's address - 8 bad
# passwords from anyone locking everyone out. A pinned subnet that collides with
# an existing network fails `docker compose up` loudly instead. Change both
# lines together (test_web.py::test_deploy_files_agree_with_the_app checks).
#
# Back up data/fleet.db - the per-node tokens live there. See
# deploy/gateflame-fleet.service for the one-line online backup.
services:
  fleet:
    build: .
    image: gateflame-fleet:1.1.0
    restart: unless-stopped
    env_file: fleet.env
    environment:
      GATEFLAME_FLEET_DB: /data/fleet.db
      GATEFLAME_FLEET_TRUSTED_PROXIES: "172.30.91.0/24"
    volumes:
      - ./data:/data
    expose:
      - "8091"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      fleet:
        condition: service_healthy
    env_file: fleet.env          # provides FLEET_DOMAIN (and FLEET_ACME_EMAIL)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  default:
    ipam:
      config:
        - subnet: "172.30.91.0/24"

volumes:
  caddy_data:
  caddy_config:
