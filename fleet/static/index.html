<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<base href="%%BASE%%">
<title>Gate^Flame Fleet</title>
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js" defer></script>
</head>
<body>
<!--
  Gate^Flame Fleet — the operator's console. Nothing on this page is invented:
  every figure comes from what a node posted or what the operator typed. A value
  the API did not return renders as an em-dash with the reason, never a zero.
  Every URL is relative (resolved against the server-rendered <base href>), so
  the page works at the root of :8091 and under the /gateflame/ prefix.
-->
<header class="topbar">
  <div class="in">
    <button class="brand" type="button" data-action="home" aria-label="All devices">
      <img src="assets/mark.svg" alt="" width="34" height="34">
      <div><div class="t">Gate<span class="c">^</span>Flame Fleet</div>
        <div class="s" id="sub">connecting…</div></div>
    </button>
    <div class="spacer"></div>
    <div class="live" id="live" aria-live="polite"><span class="dot"></span><span id="liveText">loading</span></div>
    <div class="userbox">
      <span class="who" id="who"></span>
      <form method="post" action="logout"><button class="btn sm ghost" type="submit">Sign out</button></form>
    </div>
  </div>
</header>
<main id="view"><div class="skeleton"></div></main>
<footer>
  <span>Ionity Global · Gate^Flame</span>
  <span class="truth">What boxes send: health fields, plus the Shield devices an owner put on a VPN region (the owner's own name, MAC, region). Never domains, query logs, client IP addresses or DPI output.</span>
  <span>Building Tomorrow, Today.</span>
</footer>
</body>
</html>
