<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<base href="%%BASE%%">
<title>Sign in · Gate^Flame Fleet</title>
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="login-body">
<form class="login" method="post" action="login" autocomplete="on">
  <div class="brand">
    <img src="assets/mark.svg" alt="" width="34" height="34">
    <div><div class="t">Gate<span class="c">^</span>Flame Fleet</div><div class="s">Ionity operator console</div></div>
  </div>
  <h1>Sign in</h1>
  <p>Health reports from every Gate^Flame box that reports to this server.</p>
  <div class="%%MSGCLASS%%" role="alert">%%MSG%%</div>
  <div class="field"><label for="u">User name</label>
    <input id="u" name="username" autocomplete="username" required value="%%USER%%" autofocus></div>
  <div class="field"><label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn primary" type="submit">Sign in</button>
  <div class="foot">Ionity Global · Building Tomorrow, Today.</div>
</form>
</body>
</html>
