<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what lets this page draw edge-to-edge under the
      status bar and gesture bar on Android 15+, where an app targeting SDK 35+
      is drawn that way whether it asked or not. Capacitor's SystemBars plugin
      checks for exactly this token: with it, the WebView receives the system
      insets and the page pads itself with --gf-safe-* (index.css); without it,
      Capacitor pads the WebView instead and the bars show the window background
      colour (styles.xml), not the app. Both are deliberate; the first is the
      one that looks like the product.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- One palette: tells the WebView's form controls and scrollbars to render dark too. -->
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Gate^Flame" />
    <meta name="author" content="Dennis Grobler (Wabakipi) · Johan Wilhelm van Antwerp · Ionity (Pty) Ltd" />
    <meta name="copyright" content="(c) 2018-2026 Antwerp Designs | Ionity (Pty) Ltd - All Rights Reserved - TM2" />
    <meta name="description" content="Gate^Flame — Ionity Global network security & privacy node. Policy 986 AED. Building Tomorrow, Today." />
    <meta name="theme-color" content="#080D16" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235746e3'/%3E%3Cstop offset='.5' stop-color='%2300d4b8'/%3E%3Cstop offset='1' stop-color='%2300d2ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 3 8 12v18c0 15 10 26 24 31 14-5 24-16 24-31V12z' fill='%230b0d12' stroke='url(%23g)' stroke-width='4'/%3E%3Cpath d='M32 16c6 7 9 12 9 18a9 9 0 0 1-18 0c0-3 1-5 3-7 0 3 1 5 3 6-1-6 0-11 3-17z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>Gate^Flame</title>
    <!--
      No font <link> here, on purpose. Until 2026-10-02 this page fetched three
      families from fonts.googleapis.com on every launch; they now ship inside
      the app via src/index.css (@font-face, latin subset). Nothing on this
      page reaches outside the customer's LAN before they have paired a node.
      Keep index.html and kiosk.html the same way.
    -->
    <style>
      /* Painted before any script runs, so the first frame on an edge-to-edge
         handset is the app's colour and never a white flash under the bars. */
      html, body { background: #080D16; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-mobile.tsx"></script>
  </body>
</html>
