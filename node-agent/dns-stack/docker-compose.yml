# ========================================================================================
# GATE^FLAME — DNS FILTERING STACK
# Author: Johan Wilhelm van Antwerp | Ionity (Pty) Ltd | AEDI
# Governance: Policy 986 AED | (c) 2018-2026 Antwerp Designs | Ionity (Pty) Ltd - TM2
# ========================================================================================
#
# WHY DOCKER RATHER THAN THE PI-HOLE INSTALLER
#
# The curl|bash installer keeps a hardcoded allow-list of supported OS releases and
# rejects Debian 13 (Trixie) with "Unsupported OS detected". That is a policy check,
# not a real incompatibility - Pi-hole runs fine on Trixie. The container image ships
# its own userland, so the check never applies.
#
# It also makes the base model easier: the same compose file runs on Armbian on an
# Orange Pi Zero 2W, where the installer would be equally unhappy. One artefact,
# every board.
#
# PORTS
#   53   DNS. Verified free before deploy.
#   8081 Pi-hole web admin. NOT 80 - leave 80 alone on an appliance.
#
# THIS FILE DOES NOT CHANGE YOUR NETWORK.
# Bringing this up makes the box CAPABLE of filtering. Nothing on the LAN uses it
# until a device is pointed at 192.168.0.10 for DNS. That is a separate, deliberate
# step.
# ========================================================================================

services:
  unbound:
    # Recursive resolver. Queries go to the DNS root servers directly rather than to
    # Google or Cloudflare, so no third party sees the household's browsing. This is
    # the privacy half of the product, and it is why upstream is not just 1.1.1.1.
    #
    # ARCHITECTURE - this bit them once already.
    # mvance/unbound:latest is amd64 ONLY. On an ARM64 Pi it pulls, starts, and then
    # dies in a restart loop with "exec /unbound.sh: exec format error", which is
    # docker's way of saying wrong-architecture binary. Pi-hole then had no working
    # upstream, so blocked lookups still worked (answered locally) while clean
    # lookups timed out - a confusing half-failure.
    #
    # klutchell/unbound is genuinely multi-arch: amd64, arm64 and arm. The base model
    # is an Orange Pi Zero 2W (ARM64 Allwinner H618), so multi-arch is not optional
    # here, it is the whole point.
    image: klutchell/unbound:main
    container_name: gateflame-unbound
    hostname: unbound
    restart: unless-stopped
    networks:
      gateflame:
        ipv4_address: 172.28.0.10
    healthcheck:
      # This image is distroless - no sh, no unbound-control, nothing to exec. Any
      # shell-based healthcheck reports unhealthy forever and trains you to ignore
      # healthchecks, which is worse than having none.
      #
      # Pi-hole's own healthcheck already proves the whole chain end to end: if
      # unbound were down, Pi-hole could not resolve a clean domain. So unbound is
      # left without one rather than carrying a check that always lies.
      disable: true

  pihole:
    image: pihole/pihole:latest
    container_name: gateflame-pihole
    hostname: gateflame
    restart: unless-stopped
    depends_on:
      - unbound
    networks:
      gateflame:
        ipv4_address: 172.28.0.11
    ports:
      # Bound to specific addresses. Binding 0.0.0.0:53 on a box with two default
      # routes (eth0 and wlan0 are both up here) invites answering on interfaces
      # nobody expected.
      #
      # NOW A VARIABLE, NOT A LITERAL. It was hardcoded to 192.168.0.10 in every
      # copy of this file. Docker cannot publish on an address the host does not
      # have: the moment DHCP renumbers this box, or the interface holding .10 is
      # the one that drops, `docker compose up` fails with
      #
      #     Error starting userland proxy: listen tcp4 192.168.0.10:53: bind:
      #     cannot assign requested address
      #
      # and the container never starts. The household then has NO DNS at all, on
      # every subsequent boot, until a human edits this file. An appliance must not
      # have a LAN address baked into it. Set GATEFLAME_LAN_IP in dns-stack/.env;
      # install-dns-stack.sh now writes it there from the live routing table.
      - "${GATEFLAME_LAN_IP:-192.168.0.10}:53:53/tcp"
      - "${GATEFLAME_LAN_IP:-192.168.0.10}:53:53/udp"
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      # IPv6. Phones PREFER it, so a resolver that only answers on IPv4 is a
      # resolver phones do not use - which is how a household's handsets end up
      # asking the router instead and never being filtered at all.
      #
      # Defaults to ::1 rather than to a guessed LAN address: publishing an
      # address the host does not hold makes docker refuse to start the container,
      # and a total DNS outage is a far worse failure than IPv6 going unserved.
      # install-dns-stack.sh writes the real GATEFLAME_LAN_IP6 into .env when
      # this LAN has usable IPv6; when it does not, loopback is the honest value.
      - "[${GATEFLAME_LAN_IP6:-::1}]:53:53/tcp"
      - "[${GATEFLAME_LAN_IP6:-::1}]:53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: 'Africa/Johannesburg'
      FTLCONF_webserver_api_password: '${PIHOLE_PASSWORD:-changeme}'
      # Point at unbound over the internal docker network, not at a public resolver.
      #
      # PORT 5335 IS A PI-HOLE CONVENTION, NOT A UNBOUND ONE.
      # The widely-copied Pi-hole + Unbound guides run unbound on the SAME host as
      # Pi-hole, so unbound is moved to 5335 to stay off the occupied port 53.
      # In this compose file unbound has its own container and its own IP, so nothing
      # is competing for 53 and the image listens there by default.
      # Verified on the running stack: 172.28.0.10:53 answers, :5335 times out.
      FTLCONF_dns_upstreams: '172.28.0.10#53'
      FTLCONF_dns_listeningMode: 'all'
      # Do NOT let Pi-hole become a DHCP server. Two DHCP servers on one LAN is a
      # worse failure than no filtering, and it is the mistake this product must
      # never make in a customer's house.
      FTLCONF_dhcp_active: 'false'

      # ------------------------------------------------------------------------
      # RATE LIMITING OFF. THIS IS NOT A TUNING PREFERENCE - IT IS REQUIRED.
      #
      # Pi-hole's default is 1000 queries per 60 seconds PER CLIENT. When a single
      # device is pointed at the box that ceiling is generous and invisible.
      #
      # The moment the ROUTER is pointed at the box - which is the shipping
      # configuration, the whole point of the product - every query in the house
      # arrives from ONE source address: the router's. Phones, TVs, laptops,
      # consoles and every background app are summed into that one counter. A
      # normal household passes 1000 queries a minute easily.
      #
      # When it trips, FTL does not slow the client down. It REFUSES every further
      # query from that address until the window rolls - so the entire household
      # loses DNS, in roughly one-minute blocks, repeatedly, with no error anyone
      # can see. Browsers stall. Phones fail their connectivity check, mark the
      # Wi-Fi "no internet", and drop to mobile data.
      #
      # Rate limiting exists to stop one misbehaving client on a large network. A
      # home appliance behind a forwarding router has exactly one client and it is
      # the router, so the feature can only ever misfire here.
      #
      # 0 = disabled.
      FTLCONF_dns_rateLimit_count: '0'
      FTLCONF_dns_rateLimit_interval: '0'

      # ------------------------------------------------------------------------
      # OPTIONAL RAW DNSMASQ LINES - empty by default, set in dns-stack/.env
      #
      # The one line this exists for today is `filter-AAAA`.
      #
      # If a customer's router advertises IPv6 (an RA with a prefix and RDNSS) but
      # has no working IPv6 route to the internet - very common on ISP-supplied
      # kit where IPv6 is half-enabled - then every AAAA record this box honestly
      # returns sends the phone down a path that cannot complete. Android and iOS
      # prefer IPv6, so they try the AAAA first, stall until Happy Eyeballs gives
      # up, and their connectivity validator fails often enough that the OS
      # declares the network broken and leaves it. Desktops are unaffected because
      # Windows ranks ULA below IPv4 in its RFC 6724 policy table; phones do not.
      #
      # Suppressing AAAA makes those clients use IPv4, which works. It is a
      # mitigation for someone else's broken network, NOT a default - on a LAN with
      # real IPv6 it would be actively harmful, and silently degrading a working
      # protocol is exactly the kind of dishonesty this product does not do.
      #
      # Turn it on deliberately, and only after gateflame-netcheck.sh has confirmed
      # IPv6 is advertised and non-functional:
      #     echo "GATEFLAME_DNSMASQ_LINES=filter-AAAA" >> dns-stack/.env
      FTLCONF_misc_dnsmasq_lines: '${GATEFLAME_DNSMASQ_LINES:-}'
    volumes:
      - ./data/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "dig +short +norecurse +retry=0 @127.0.0.1 pi.hole || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  gateflame:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
