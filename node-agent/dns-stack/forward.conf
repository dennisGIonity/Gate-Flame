# ========================================================================================
# GATE^FLAME - BYPASS FORWARDING CONFIG
# Governance: Policy 986 AED | (c) 2018-2026 Antwerp Designs | Ionity (Pty) Ltd - TM2
# ========================================================================================
#
# Used ONLY in bypass mode, when Pi-hole has failed for five minutes and could not be
# recovered. The single goal here is that the household's internet works.
#
# WHY THIS FORWARDS INSTEAD OF RECURSING
#
# The main stack recurses to the root servers so no third party sees the household's
# queries. That is the right default and it stays.
#
# Bypass is different. It exists because something is already broken, and recursion has
# more moving parts to be broken WITH - root hints, DNSSEC validation, a cold cache and
# 50-200ms cold lookups. Forwarding to two large public resolvers is the simplest thing
# that can possibly work, and simplicity is the entire requirement of a last resort.
#
# The privacy cost is real and is accepted deliberately: while in bypass, Cloudflare and
# Quad9 see the household's queries. That is a worse privacy position than normal
# operation and a far better one than a family with no internet. It is also loudly
# reported - the app and display show protection OFF - so nobody is misled about which
# state they are in.
# ========================================================================================

server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # Only the LAN may query. A bypass resolver reachable from the internet would be an
    # open resolver and a DNS amplification reflector - a broken appliance must not
    # become someone else's attack tool.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: 169.254.0.0/16 allow

    hide-identity: yes
    hide-version: yes

    # Modest cache. Bypass should be short-lived, and a large cache would only mean more
    # stale unfiltered answers lingering after filtering is restored.
    msg-cache-size: 8m
    rrset-cache-size: 16m

    # DNSSEC validation is OFF here on purpose. In bypass the priority is that names
    # resolve at all; a validation failure that blocks a domain would look exactly like
    # the outage this mode exists to end.
    val-permissive-mode: yes

forward-zone:
    name: "."
    # Two independent operators, so one being down does not repeat the outage.
    # Quad9 filters known-malicious domains at the resolver, which preserves a thin
    # slice of protection even while Gate^Flame's own filtering is unavailable.
    forward-addr: 9.9.9.9
    forward-addr: 1.1.1.1
